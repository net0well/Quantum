name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (vazio = calcula automaticamente)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Compilar, testar e publicar
    runs-on: windows-latest
    timeout-minutes: 45
    if: "!contains(github.event.head_commit.message, '[skip release]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar o .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache do NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar ferramentas
        run: dotnet tool restore

      - name: Calcular a versão
        id: version
        shell: pwsh
        run: |
          $manual = '${{ inputs.version }}'
          if ($manual) {
            $version = $manual.TrimStart('v')
          }
          else {
            # major.minor vêm do Directory.Build.props; o patch é o número da execução,
            # então toda entrada na main gera uma versão nova e crescente.
            $props = [xml](Get-Content Directory.Build.props)
            $base = $props.SelectSingleNode('//Version').InnerText
            $parts = $base.Split('.')
            $version = '{0}.{1}.{2}' -f $parts[0], $parts[1], $env:GITHUB_RUN_NUMBER
          }

          Write-Host "Versão: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restaurar dependências
        run: dotnet restore Quantum.slnx

      - name: Compilar
        run: dotnet build Quantum.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Executar os testes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path TestResults -Force | Out-Null
          $runner = 'tests/Quantum.Audio.Tests/bin/Release/net10.0-windows/Quantum.Audio.Tests.exe'
          & $runner -trx "$PWD/TestResults/quantum.trx"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Testes reprovados — nenhuma release será criada."
            exit $LASTEXITCODE
          }

      - name: Gerar as notas da versão
        id: notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $previous = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1

          # As mesmas notas vão para a release e para dentro do pacote, que é o que
          # o app mostra na faixa de atualização.
          $arguments = @(
            'api', "repos/$env:GITHUB_REPOSITORY/releases/generate-notes",
            '-f', "tag_name=$tag"
          )
          if ($previous) { $arguments += @('-f', "previous_tag_name=$previous") }

          $notes = ''
          try {
            $response = & gh @arguments | ConvertFrom-Json
            $notes = $response.body
          }
          catch {
            Write-Host "Nao foi possivel gerar notas automaticas: $_"
            $notes = "Consulte o historico de commits para as mudancas desta versao."
          }

          $notes | Set-Content release-notes.md -Encoding utf8
          Write-Host "Notas geradas ($($notes.Length) caracteres)."

      - name: Publicar o executável portátil
        # Arquivo único: quem prefere não instalar baixa um .exe e roda.
        run: >
          dotnet publish src/Quantum.App/Quantum.App.csproj
          --configuration Release
          --output publish-portable
          --runtime win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}

      - name: Publicar para o instalador
        # Aqui NÃO usa arquivo único de propósito: o Velopack gera atualizações
        # delta comparando arquivo a arquivo, e um único blob de 70 MB muda por
        # inteiro a cada versão, o que anularia o delta.
        run: >
          dotnet publish src/Quantum.App/Quantum.App.csproj
          --configuration Release
          --output publish-installer
          --runtime win-x64
          --self-contained
          -p:PublishSingleFile=false
          -p:Version=${{ steps.version.outputs.version }}

      - name: Empacotar com o Velopack
        run: >
          dotnet vpk pack
          --packId Quantum
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish-installer
          --mainExe Quantum.exe
          --packTitle Quantum
          --packAuthors net0well
          --icon src/Quantum.App/Assets/quantum.ico
          --releaseNotes release-notes.md
          --outputDir releases

      - name: Montar os artefatos
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:VERSION
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null

          Copy-Item publish-portable/Quantum.exe "artifacts/Quantum-portable-v$version.exe"
          Copy-Item releases/Quantum-win-Setup.exe "artifacts/Quantum-Setup-v$version.exe"

          # O feed do Velopack: sem estes arquivos o app instalado não enxerga
          # que existe versão nova.
          Copy-Item releases/*.nupkg artifacts/
          Copy-Item releases/RELEASES artifacts/ -ErrorAction SilentlyContinue
          Copy-Item releases/releases.win.json artifacts/ -ErrorAction SilentlyContinue
          Copy-Item releases/assets.win.json artifacts/ -ErrorAction SilentlyContinue

          $lines = Get-ChildItem artifacts -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Set-Content artifacts/checksums-sha256.txt -Encoding utf8

          $setupMb = [Math]::Round((Get-Item releases/Quantum-win-Setup.exe).Length / 1MB, 1)
          $portableMb = [Math]::Round((Get-Item publish-portable/Quantum.exe).Length / 1MB, 1)
          "setupMb=$setupMb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "portableMb=$portableMb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Guardar os artefatos da execução
        uses: actions/upload-artifact@v4
        with:
          name: quantum-v${{ steps.version.outputs.version }}
          path: artifacts/*
          retention-days: 90

      - name: Criar a release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SETUP_MB: ${{ steps.package.outputs.setupMb }}
          PORTABLE_MB: ${{ steps.package.outputs.portableMb }}
          TITLE_MARK: '##'
        run: |
          $version = $env:VERSION
          $tag = "v$version"
          $mark = $env:TITLE_MARK

          $header = @(
            "$mark Download"
            ''
            '| Arquivo | Para quem |'
            '|---|---|'
            "| **Quantum-Setup-v$version.exe** | Instala e **se atualiza sozinho** daqui em diante. Vai para %LocalAppData%, sem pedir administrador. ($env:SETUP_MB MB) |"
            "| **Quantum-portable-v$version.exe** | Um arquivo, sem instalar nada. Avisa quando sai versão nova, mas não se atualiza sozinho. ($env:PORTABLE_MB MB) |"
            "| ``checksums-sha256.txt`` | Conferência de integridade |"
            ''
            'Os demais arquivos são o feed de atualização e não precisam ser baixados à mão.'
            ''
            'Requer Windows 10 (1809+) ou Windows 11, 64 bits.'
            ''
            '> O Windows SmartScreen pode avisar sobre um executável sem assinatura digital.'
            '> É esperado: o binário não é assinado por certificado pago.'
            ''
            '---'
            ''
          )

          $header | Set-Content final-notes.md -Encoding utf8
          Get-Content release-notes.md | Add-Content final-notes.md -Encoding utf8

          gh release create $tag (Get-ChildItem artifacts -File | ForEach-Object { $_.FullName }) `
            --title "Quantum $tag" `
            --notes-file final-notes.md
