name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Segunda-feira, 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Análise estática
    runs-on: windows-latest
    timeout-minutes: 30
    # Em repositório privado a varredura de código exige GitHub Advanced Security.
    # Sem isso o passo falharia, então o job simplesmente não roda.
    if: github.event.repository.visibility == 'public'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar o .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Inicializar o CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Compilar
        run: dotnet build Quantum.slnx --configuration Release

      - name: Analisar
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:csharp'
